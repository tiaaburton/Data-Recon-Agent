name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Format Check
        run: |
          diff -u <(echo -n) <(gofmt -d $(git ls-files '*.go' | grep -v 'internal/agentengine'))

      - name: Go Vet
        run: go vet ./cmd/... ./pkg/... ./tests/...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          args: --timeout=5m --config=.golangci.yml

  test:
    name: Unit & Evaluation Benchmark Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Test Suite & Golden Evaluation Benchmarks
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./tests/... ./pkg/...

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.out

  build:
    name: Compile Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build All Executables
        run: |
          mkdir -p bin
          go build -v -o bin/synth cmd/synth/main.go
          go build -v -o bin/loader cmd/loader/main.go
          go build -v -o bin/verifier cmd/verifier/main.go
          go build -v -o bin/agent cmd/agent/main.go

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
