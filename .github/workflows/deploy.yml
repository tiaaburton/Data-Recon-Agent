name: CD Deploy Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'internal/**'
      - 'iac/**'
      - 'terraform/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vertex AI Agent Engine & Gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Go ADK Agent to Vertex AI Agent Engine
        run: |
          chmod +x scripts/deploy_agent_engine.sh
          ./scripts/deploy_agent_engine.sh

      - name: Apply Agent Gateway & Agent Registry IaC
        run: |
          chmod +x scripts/setup_agent_gateway.sh
          ./scripts/setup_agent_gateway.sh

      - name: Update Gemini Enterprise Agent Platform
        run: |
          chmod +x scripts/register_gemini_enterprise.sh
          ./scripts/register_gemini_enterprise.sh
